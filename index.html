<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NB09 ROV - Trạm Điều Hành Tự Động</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        :root {
            --vn-red: #da251d;
            --vn-gold: #ffdd00;
            --neon-blue: #00f3ff;
            --neon-green: #10b981;
            --neon-red: #f43f5e;
            --panel-bg: rgba(15, 23, 42, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #020617; color: #fff; padding: 10px; overflow-x: hidden; }

        /* HEADER */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 16px; background: var(--panel-bg); backdrop-filter: blur(8px);
            border: 2px solid var(--vn-red); border-radius: 12px; margin-bottom: 12px;
            box-shadow: 0 0 15px rgba(218, 37, 29, 0.5);
        }
        .header h2 { 
            font-size: 1.1rem; color: var(--vn-gold); letter-spacing: 1px; 
            display: flex; align-items: center; gap: 8px;
            text-shadow: 0 0 8px rgba(255, 221, 0, 0.6);
        }
        .header h2::before { content: "🇻🇳"; font-size: 1.4rem; }

        /* NÚT BẮT ĐẦU DÙNG CHUNG */
        .btn-start {
            background: linear-gradient(135deg, #da251d, #ffdd00); color: #000;
            border: none; padding: 10px 20px; border-radius: 8px; font-weight: 800;
            font-size: 0.95rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 0 15px rgba(255, 221, 0, 0.6); transition: 0.2s;
        }
        .btn-start:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* TRẠNG THÁI TÍN HIỆU LORA */
        .lora-status-badge {
            padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold;
            background: rgba(0,0,0,0.8); border: 1px solid var(--neon-red); color: var(--neon-red);
            display: flex; align-items: center; gap: 6px; transition: 0.3s;
        }

        /* KHUNG KHUNG AR */
        .ar-viewport {
            position: relative; width: 100%; height: 60vh; min-height: 380px;
            background: #000; border-radius: 14px; overflow: hidden;
            border: 4px solid var(--vn-red);
            box-shadow: 0 0 25px rgba(218, 37, 29, 0.7);
        }

        .star-badge {
            position: absolute; top: 10px; right: 12px;
            background: rgba(218, 37, 29, 0.85); border: 1px solid var(--vn-gold);
            padding: 4px 10px; border-radius: 20px; color: var(--vn-gold);
            font-size: 0.85rem; font-weight: bold; backdrop-filter: blur(4px); z-index: 10;
        }

        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .ar-hint {
            position: absolute; top: 10px; left: 12px; background: rgba(0,0,0,0.75);
            padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; color: #f8fafc;
            border: 1px solid var(--vn-gold); backdrop-filter: blur(4px); z-index: 10;
        }
        .cmd-badge {
            position: absolute; bottom: 12px; left: 12px; background: rgba(0,0,0,0.85);
            padding: 6px 12px; border-radius: 6px; font-weight: bold; color: var(--vn-gold);
            border: 1px solid var(--vn-red); font-size: 0.85rem; z-index: 10;
        }

        /* DATA PANEL */
        .data-panel {
            margin-top: 12px; background: var(--panel-bg); backdrop-filter: blur(8px);
            border: 2px solid rgba(218, 37, 29, 0.4); border-radius: 12px; padding: 12px;
        }
        .data-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        @media (max-width: 500px) { .data-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .data-box { 
            background: rgba(30, 41, 59, 0.8); padding: 8px; border-radius: 8px; text-align: center;
            border: 1px solid rgba(255, 221, 0, 0.2);
        }
        .data-title { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }
        .data-val { font-size: 1.1rem; font-weight: bold; color: var(--vn-gold); margin-top: 2px; }

        .log-box {
            font-family: monospace; font-size: 0.75rem; height: 60px; overflow-y: auto;
            background: #020617; padding: 6px; border-radius: 6px; color: #4ade80; margin-top: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>NB09 COMMANDER</h2>
        <!-- TRẠNG THÁI TÍN HIỆU LORA -->
        <div id="loraStatus" class="lora-status-badge">
            <i class="fa-solid fa-signal"></i> Chưa phát hiện tín hiệu
        </div>
        <!-- NÚT BẮT ĐẦU DUY NHẤT -->
        <button id="btnStart" class="btn-start"><i class="fa-solid fa-play"></i> BẮT ĐẦU</button>
    </div>

    <!-- KHUNG HÌNH AR MẶT HỒ -->
    <div class="ar-viewport" id="viewport">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvasOverlay"></canvas>
        <div class="ar-hint"><i class="fa-solid fa-hand-pointer"></i> Chạm vào mặt hồ để cắm mốc A, B, C...</div>
        <div class="star-badge"><i class="fa-solid fa-star"></i> VIỆT NAM</div>
        <div class="cmd-badge">LỆNH ĐIỀU HƯỚNG: <span id="cmdSent">WAITING</span></div>
    </div>

    <!-- BẢNG DỮ LIỆU WQI -->
    <div class="data-panel">
        <div class="data-grid">
            <div class="data-box">
                <div class="data-title">Độ Sâu Vừa Đo</div>
                <div id="valDepth" class="data-val">0.00 m</div>
            </div>
            <div class="data-box">
                <div class="data-title">TDS Vừa Đo</div>
                <div id="valTDS" class="data-val">0 ppm</div>
            </div>
            <div class="data-box">
                <div class="data-title">Độ Đục Vừa Đo</div>
                <div id="valTurb" class="data-val">0 NTU</div>
            </div>
            <div class="data-box">
                <div class="data-title">Đánh Giá WQI</div>
                <div id="valWQI" class="data-val" style="color:var(--neon-green);">TỐT</div>
            </div>
        </div>
        <div id="logConsole" class="log-box">Đặt điện thoại lên tripod cố định rồi nhấn 'BẮT ĐẦU'...</div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvasOverlay');
        const ctx = canvas.getContext('2d');

        let arPoints = [];
        let pointCount = 0;
        let lastLoraData = null;
        let port, reader, writer;
        let loraSignalTimeout = null;

        // BẤM NÚT "BẮT ĐẦU" KHỞI ĐỘNG TẤT CẢ
        document.getElementById('btnStart').addEventListener('click', async () => {
            log("🚀 Đang khởi tạo hệ thống...");

            // 1. CƯỠNG CHẾ BẬT CAMERA
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment", width: 1280, height: 720 }
                });
                video.srcObject = stream;
                log("📷 Camera đã kích hoạt!");
                requestAnimationFrame(renderARLoop);
            } catch (err) {
                log("❌ Lỗi mở Camera: " + err);
            }

            // 2. MỞ CỬA SỔ KẾT NỐI LORA OTG USB
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 115200 });
                log("🔌 Đã kết nối cáp LoRa USB!");
                writer = port.writable.getWriter();
                readSerialData();
            } catch (err) {
                log("⚠️ Chưa chọn thiết bị USB-LoRa hoặc trình duyệt từ chối.");
            }

            // Ẩn nút bắt đầu sau khi kích hoạt thành công
            document.getElementById('btnStart').style.display = 'none';
        });

        // TỰ ĐỘNG ĐỌC DỮ LIỆU SERIAL LORA
        async function readSerialData() {
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            reader = textDecoder.readable.getReader();

            let buffer = "";
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                if (value) {
                    buffer += value;
                    let lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (let line of lines) processLoraPayload(line.trim());
                }
            }
        }

        // XỬ LÝ GÓI TIN LORA VÀ CẬP NHẬT TRẠNG THÁI TÍN HIỆU
        function processLoraPayload(payload) {
            log("📥 LORA: " + payload);

            // Cập nhật trạng thái tín hiệu LoRa -> ĐÃ PHÁT HIỆN TÍN HIỆU
            const statusEl = document.getElementById('loraStatus');
            statusEl.innerHTML = '<i class="fa-solid fa-wifi"></i> Đã phát hiện tín hiệu';
            statusEl.style.color = '#10b981';
            statusEl.style.borderColor = '#10b981';

            // Reset bộ đếm thời gian tín hiệu (Nếu sau 8s không nhận thêm gói mới sẽ báo mất tín hiệu)
            clearTimeout(loraSignalTimeout);
            loraSignalTimeout = setTimeout(() => {
                statusEl.innerHTML = '<i class="fa-solid fa-signal"></i> Chưa phát hiện tín hiệu';
                statusEl.style.color = '#f43f5e';
                statusEl.style.borderColor = '#f43f5e';
            }, 8000);

            if (payload.includes("PAYLOAD LORA")) {
                const depthMatch = payload.match(/Độ sâu max:\s*([\d.]+)/);
                const tdsMatch   = payload.match(/TDS max:\s*([\d.]+)/);
                const turbMatch  = payload.match(/Độ đục max:\s*([\d.]+)/);

                if (depthMatch && tdsMatch && turbMatch) {
                    const depth = parseFloat(depthMatch[1]).toFixed(2);
                    const tds   = parseFloat(tdsMatch[1]).toFixed(0);
                    const turb  = parseFloat(turbMatch[1]).toFixed(0);

                    let wqiText = "TỐT", color = "#10b981";
                    if (tds > 500 || turb > 100) { wqiText = "T.BÌNH"; color = "#ffdd00"; }
                    if (tds > 1000 || turb > 250) { wqiText = "Ô NHIỄM"; color = "#f43f5e"; }

                    document.getElementById('valDepth').innerText = depth + " m";
                    document.getElementById('valTDS').innerText   = tds + " ppm";
                    document.getElementById('valTurb').innerText  = turb + " NTU";
                    const wqiEl = document.getElementById('valWQI');
                    wqiEl.innerText = wqiText;
                    wqiEl.style.color = color;

                    lastLoraData = { depth, tds, turb, wqi: wqiText, color };

                    if (arPoints.length > 0) {
                        let lastP = arPoints[arPoints.length - 1];
                        lastP.depth = depth; lastP.tds = tds;
                        lastP.turb = turb; lastP.wqi = wqiText; lastP.color = color;
                    }
                }
            }
        }

        // CHẠM MẶT HỒ ĐỂ CẮM MỐC AR
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            pointCount++;
            const pointName = String.fromCharCode(64 + pointCount);

            const newPoint = {
                name: "Điểm " + pointName,
                x: x,
                y: y,
                depth: lastLoraData ? lastLoraData.depth : "0.50",
                tds: lastLoraData ? lastLoraData.tds : "120",
                turb: lastLoraData ? lastLoraData.turb : "15",
                wqi: lastLoraData ? lastLoraData.wqi : "TỐT",
                color: lastLoraData ? lastLoraData.color : "#ffdd00"
            };

            arPoints.push(newPoint);
            log(`📍 Đã cắm mốc AR [${newPoint.name}] trên mặt hồ!`);
        });

        // THUẬT TOÁN VẼ TĂNG CƯỜNG AR REALTIME
        let lastCmdTime = 0;
        function renderARLoop() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Auto-docking
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;
                let maxBrightness = 0, targetX = -1, targetY = -1;

                for (let i = 0; i < data.length; i += 32) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    let brightness = (r + g + b) / 3;
                    if (brightness > maxBrightness && brightness > 210) {
                        maxBrightness = brightness;
                        let pixelIndex = i / 4;
                        targetX = pixelIndex % canvas.width;
                        targetY = Math.floor(pixelIndex / canvas.width);
                    }
                }

                const centerX = canvas.width / 2;
                ctx.strokeStyle = 'rgba(255, 221, 0, 0.7)';
                ctx.lineWidth = 2;
                ctx.setLineDash([6, 6]);
                ctx.strokeRect(centerX - 50, 0, 100, canvas.height);
                ctx.setLineDash([]);

                if (targetX !== -1) {
                    ctx.fillStyle = '#da251d';
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 8, 0, 2 * Math.PI);
                    ctx.fill();

                    if (Date.now() - lastCmdTime > 300) {
                        lastCmdTime = Date.now();
                        if (targetX < centerX - 50) sendLoraCommand('L');
                        else if (targetX > centerX + 50) sendLoraCommand('R');
                        else sendLoraCommand('F');
                    }
                }

                if (arPoints.length > 1) {
                    ctx.beginPath();
                    ctx.strokeStyle = '#ffdd00';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 8]);
                    ctx.moveTo(arPoints[0].x, arPoints[0].y);
                    for (let p of arPoints) ctx.lineTo(p.x, p.y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }

                for (let p of arPoints) {
                    ctx.fillStyle = '#da251d';
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 11, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#ffdd00';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    ctx.fillStyle = '#ffdd00';
                    ctx.font = 'bold 11px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('★', p.x, p.y + 4);
                    ctx.textAlign = 'left';

                    const boxW = 145, boxH = 55;
                    const boxX = p.x + 15;
                    const boxY = p.y - 30;

                    ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                    ctx.fillRect(boxX, boxY, boxW, boxH);
                    ctx.strokeStyle = '#da251d';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(boxX, boxY, boxW, boxH);

                    ctx.fillStyle = '#ffdd00';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText(`📌 ${p.name}`, boxX + 6, boxY + 16);

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '10px Arial';
                    ctx.fillText(`Sâu: ${p.depth}m | WQI: ${p.wqi}`, boxX + 6, boxY + 32);
                    ctx.fillText(`TDS: ${p.tds}ppm | Đục: ${p.turb}`, boxX + 6, boxY + 46);
                }
            }
            requestAnimationFrame(renderARLoop);
        }

        async function sendLoraCommand(cmdChar) {
            if (writer) {
                await writer.write(new TextEncoder().encode(cmdChar));
                document.getElementById('cmdSent').innerText = cmdChar;
            }
        }

        function log(msg) {
            const consoleEl = document.getElementById('logConsole');
            consoleEl.innerHTML += "<div>" + msg + "</div>";
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }
    </script>
</body>
</html>
